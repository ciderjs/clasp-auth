name: "Setup clasp auth"
description: "Restore .clasprc.json and .clasp.json from GitHub Secrets, with automatic cleanup"
author: "ciderjs/luth"
branding:
  icon: "lock"
  color: "red"
inputs:
  clasprc_json:
    description: "Base64-encoded .clasprc.json content (from CLASPRC_JSON secret)"
    required: true
  clasp_json:
    description: "Base64-encoded .clasp.json content (from CLASP_JSON secret). Optional."
    required: false
    default: ""
runs:
  using: "node24"
  main: "dist/action/main.mjs"
  post: "dist/action/post.mjs"
